<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#000;--panel:#171717;--border:#262626;--text:#fff;--muted:#8A8A8A;--accent:#FFFF7D}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:720px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:16px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 2px 14px}
  .brand{font-weight:600;letter-spacing:-.01em}
  .brand span{color:var(--accent)}
  .status{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px}
  .dot{width:8px;height:8px;border-radius:50%;background:#555}
  .dot.on{background:var(--accent)}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px}
  #join{margin:auto;width:100%;max-width:380px;padding:24px}
  #join h1{font-size:20px;margin:0 0 6px;font-weight:600}
  #join p{color:var(--muted);margin:0 0 18px;font-size:14px}
  label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
  input{width:100%;background:#000;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:11px 12px;font:inherit;outline:none}
  input:focus{border-color:var(--accent)}
  button{background:var(--accent);color:#000;border:0;border-radius:8px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .field{margin-bottom:14px}
  #join button{width:100%}
  .err{color:#ff8a8a;font-size:13px;min-height:18px;margin-top:8px}
  #chat{display:none;flex:1;min-height:0;flex-direction:column}
  #messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:80%;align-self:flex-start}
  .msg.me{align-self:flex-end;text-align:right}
  .meta{font-size:12px;color:var(--muted);margin-bottom:4px}
  .meta b{color:var(--text);font-weight:500}
  .msg.me .meta b{color:var(--accent)}
  .bubble{display:inline-block;text-align:left;background:#000;border:1px solid var(--border);border-radius:10px;padding:8px 12px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
  .sys{align-self:center;color:var(--muted);font-size:12px}
  form#send{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border)}
  .room{color:var(--muted);font-size:12px;padding:10px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .room code{color:var(--text)}
  .link{background:none;border:1px solid var(--border);color:var(--muted);padding:4px 10px;font-weight:500;font-size:12px}
  .link:hover{color:var(--text)}
  .hint{color:var(--muted);font-size:12px;padding:0 16px 10px;border-bottom:1px solid var(--border)}
  .room{border-bottom:0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Chat<span>.</span></div>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">offline</span></div>
  </header>

  <div id="join" class="panel">
    <h1>Join the chat</h1>
    <p>Enter your name, the room and its code. If the room is new, the code you enter becomes its code. Messages are end-to-end encrypted with it.</p>
    <form id="joinForm">
      <div class="field"><label for="name">Your name</label><input id="name" maxlength="32" autocomplete="nickname" placeholder="e.g. Minh" required></div>
      <div class="field"><label for="roomIn">Room</label><input id="roomIn" maxlength="40" placeholder="lobby" required></div>
      <div class="field"><label for="code">Room code</label><input id="code" type="password" maxlength="64" autocomplete="off" placeholder="New room? Your code sets it" required></div>
      <button id="joinBtn" type="submit">Join</button>
      <div class="err" id="err"></div>
    </form>
  </div>

  <div id="chat" class="panel">
    <div class="room"><span>Room <code id="roomName"></code> · you are <code id="meName"></code></span><span><button class="link" id="copy" type="button" title="The link includes the room only — share the code separately">Copy invite link (no code)</button> <button class="link" id="bell" type="button" title="Notifications on/off">🔔 On</button> <button class="link" id="leave" type="button">Leave</button></span></div>
    <div class="hint">🔒 Encrypted with the room code. The invite link includes only the room — share the code separately.</div>
    <div id="messages" aria-live="polite"></div>
    <form id="send"><input id="text" maxlength="1000" autocomplete="off" placeholder="Type a message…"><button type="submit">Send</button></form>
  </div>
</div>

<script>
(() => {
  // Realtime relay: ntfy.sh public pub/sub (free, no account, HTTPS). The relay only ever sees
  // a hashed topic and AES-GCM ciphertext; the key is derived in the browser from room + room code.
  const RELAY = 'https://ntfy.sh';
  const APP = 'offsuit-rtchat-7f3k9q';
  const $ = id => document.getElementById(id);
  const clean = s => (s || '').trim().replace(/\s+/g, ' ');
  const slug = s => clean(s).toLowerCase().replace(/[^a-z0-9_-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'lobby';
  const myId = Math.random().toString(36).slice(2, 10);
  const seen = new Set();
  const enc = new TextEncoder(), dec = new TextDecoder();
  const historyIds = new Set();
  let es, name, room, topic, key, joinedAt = 0, unread = 0, audioCtx;
  const BASE_TITLE = document.title;
  let notifyOn = localStorage.getItem('chat-notify') !== 'off';
  const canNotify = 'Notification' in window;

  const hashRoom = new URLSearchParams(location.hash.slice(1)).get('room');
  $('roomIn').value = hashRoom || '';
  $('name').value = localStorage.getItem('chat-name') || '';
  ($('name').value ? ($('roomIn').value ? $('code') : $('roomIn')) : $('name')).focus();

  const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');

  async function deriveKey(room, code) {
    const base = await crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: enc.encode('offsuit-rtchat/v1/' + room), iterations: 200000, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  async function seal(obj) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(obj)));
    return JSON.stringify({ v: 1, iv: b64(iv), ct: b64(ct) });
  }
  // returns object, or null if not our format, or false if it is our format but the key is wrong
  async function open(str, k = key) {
    let e; try { e = JSON.parse(str); } catch { return null; }
    if (!e || e.v !== 1 || typeof e.iv !== 'string' || typeof e.ct !== 'string') return null;
    try { return JSON.parse(dec.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(e.iv) }, k, unb64(e.ct)))); }
    catch { return false; }
  }

  function setStatus(on, text) { $('dot').classList.toggle('on', on); $('statusText').textContent = text; }
  function fmt(ts) {
    const d = new Date(ts), now = new Date();
    const t = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    return d.toDateString() === now.toDateString() ? t : d.toLocaleDateString([], { day: 'numeric', month: 'short' }) + ' ' + t;
  }
  function addSys(t) { const d = document.createElement('div'); d.className = 'sys'; d.textContent = t; push(d); }
  function push(el) { const m = $('messages'); const atBottom = m.scrollHeight - m.scrollTop - m.clientHeight < 80; m.appendChild(el); if (atBottom || el.classList.contains('me')) m.scrollTop = m.scrollHeight; }
  function addMsg(p) {
    const d = document.createElement('div'); d.className = 'msg' + (p.id === myId ? ' me' : '');
    const meta = document.createElement('div'); meta.className = 'meta';
    const b = document.createElement('b'); b.textContent = p.name; meta.append(b, ' · ' + fmt(p.ts));
    const bub = document.createElement('div'); bub.className = 'bubble'; bub.textContent = p.text;
    d.append(meta, bub); push(d);
  }

  // ---- notifications / unread / sound ----
  const isAway = () => document.hidden || !document.hasFocus();
  function renderBell() {
    const b = $('bell');
    b.textContent = notifyOn ? '🔔 On' : '🔕 Off';
    b.title = !notifyOn ? 'Notifications off — click to turn on'
      : !canNotify ? 'Desktop notifications not supported here (sound + tab count only)'
      : Notification.permission === 'denied' ? 'Desktop notifications blocked in browser settings (sound + tab count only)'
      : 'Notifications on — click to turn off';
  }
  async function askPermission() {
    if (!canNotify || Notification.permission !== 'default') return;
    try { await Notification.requestPermission(); } catch {}
  }
  function initAudio() {
    try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch {}
  }
  function ding() {
    if (!audioCtx) return;
    try {
      const t = audioCtx.currentTime, o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(880, t); o.frequency.exponentialRampToValueAtTime(660, t + 0.15);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.08, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + 0.32);
    } catch {}
  }
  function updateTitle() { document.title = unread ? '(' + unread + ') ' + BASE_TITLE : BASE_TITLE; }
  function clearUnread() { if (!isAway()) { unread = 0; updateTitle(); } }
  window.addEventListener('focus', clearUnread);
  document.addEventListener('visibilitychange', clearUnread);
  function onIncoming(p) {
    if (!isAway()) return;
    unread++; updateTitle();
    if (!notifyOn) return;
    ding();
    if (canNotify && Notification.permission === 'granted') {
      try {
        const n = new Notification(p.name, { body: p.text.slice(0, 200), tag: 'chat-' + room, renotify: true });
        n.onclick = () => { window.focus(); n.close(); };
      } catch {}
    }
  }
  $('bell').addEventListener('click', async () => {
    notifyOn = !notifyOn;
    localStorage.setItem('chat-notify', notifyOn ? 'on' : 'off');
    if (notifyOn) {
      initAudio(); await askPermission();
      if (!canNotify) addSys('Desktop notifications aren\'t supported in this browser — you\'ll get a sound and the tab count.');
      else if (Notification.permission === 'denied') addSys('Desktop notifications are blocked for this site in your browser settings — you\'ll get a sound and the tab count.');
    }
    renderBell();
  });

  function connect() {
    setStatus(false, 'connecting…');
    es = new EventSource(RELAY + '/' + topic + '/sse?since=12h');
    es.onopen = () => setStatus(true, 'live');
    es.onerror = () => setStatus(false, es.readyState === 2 ? 'offline' : 'reconnecting…');
    es.addEventListener('message', async ev => {
      let n; try { n = JSON.parse(ev.data); } catch { return; }
      if (!n || seen.has(n.id)) return;
      seen.add(n.id);
      const p = await open(n.message);
      if (!p || typeof p !== 'object') return; // not decryptable with this room code -> ignore
      const who = String(p.name || '?').slice(0, 32);
      if (p.t === 'join' || p.t === 'create') {
        if (p.id !== myId) addSys(who + (p.t === 'create' ? ' created the room · ' : ' joined · ') + fmt(p.ts || n.time * 1000));
        return;
      }
      if (typeof p.text !== 'string') return;
      const m = { id: p.id, name: who, text: p.text.slice(0, 1000), ts: Number(p.ts) || n.time * 1000 };
      addMsg(m);
      // only live messages from others (not history loaded on join)
      if (p.id !== myId && !historyIds.has(n.id) && n.time * 1000 >= joinedAt - 60000) onIncoming(m);
    });
  }

  async function publish(obj) {
    const r = await fetch(RELAY + '/', { method: 'POST', body: JSON.stringify({ topic, message: await seal(obj) }) });
    if (!r.ok) throw new Error(r.status === 429 ? 'Rate limited by the free relay — wait a moment.' : 'Send failed (' + r.status + ')');
  }

  // Validate the code against the room's recent (encrypted) history.
  // 'ok' = at least one message decrypts; 'wrong' = room has encrypted messages but none decrypt; 'new' = room empty.
  async function checkCode(k) {
    const r = await fetch(RELAY + '/' + topic + '/json?poll=1&since=12h', { cache: 'no-store' });
    if (!r.ok) throw new Error('Could not reach the chat relay (' + r.status + '). Try again.');
    const lines = (await r.text()).split('\n').filter(Boolean);
    let ours = 0; historyIds.clear();
    lines.forEach(l => { try { historyIds.add(JSON.parse(l).id); } catch {} });
    for (const line of lines.reverse()) {
      let n; try { n = JSON.parse(line); } catch { continue; }
      if (n.event !== 'message') continue;
      const p = await open(n.message, k);
      if (p) return 'ok';
      if (p === false) ours++;
    }
    return ours ? 'wrong' : 'new';
  }

  $('joinForm').addEventListener('submit', async e => {
    e.preventDefault();
    $('err').textContent = '';
    name = clean($('name').value).slice(0, 32);
    const roomRaw = clean($('roomIn').value), code = $('code').value;
    if (!name) { $('err').textContent = 'Please enter your name.'; return; }
    if (!roomRaw) { $('err').textContent = 'Please enter a room.'; return; }
    if (!code) { $('err').textContent = 'Please enter the room code.'; return; }
    room = slug(roomRaw);
    initAudio(); if (notifyOn) askPermission().then(() => { if (key) renderBell(); }); // inside the click gesture
    const btn = $('joinBtn'); btn.disabled = true; btn.textContent = 'Checking code…';
    try {
      topic = APP + '-' + hex(await crypto.subtle.digest('SHA-256', enc.encode('room/' + room))).slice(0, 32);
      const k = await deriveKey(room, code);
      const state = await checkCode(k);
      if (state === 'wrong') { $('err').textContent = 'Wrong room code.'; $('code').value = ''; $('code').focus(); return; }
      key = k; joinedAt = Date.now(); renderBell();
      localStorage.setItem('chat-name', name);
      history.replaceState(null, '', '#room=' + encodeURIComponent(room));
      $('roomName').textContent = room; $('meName').textContent = name;
      $('join').style.display = 'none'; $('chat').style.display = 'flex';
      addSys(state === 'new'
        ? 'New room created — your code is now its code. Messages from the last ~12h are shown; nothing is stored long-term.'
        : 'You joined as ' + name + '. Messages from the last ~12h are shown; nothing is stored long-term.');
      connect(); $('text').focus();
      publish({ t: state === 'new' ? 'create' : 'join', id: myId, name, ts: Date.now() }).catch(err => addSys(err.message));
    } catch (err) {
      $('err').textContent = err.message || 'Something went wrong. Try again.';
    } finally { btn.disabled = false; btn.textContent = 'Join'; }
  });

  $('send').addEventListener('submit', async e => {
    e.preventDefault();
    const text = $('text').value.trim();
    if (!text || !key) return;
    $('text').value = '';
    try { await publish({ id: myId, name, text, ts: Date.now() }); }
    catch (err) { $('text').value = text; addSys(err.message); }
  });

  $('copy').addEventListener('click', async () => {
    const link = location.origin + location.pathname + '#room=' + encodeURIComponent(room);
    try { await navigator.clipboard.writeText(link); $('copy').textContent = 'Copied — send the code separately'; } catch { prompt('Invite link (share the code separately):', link); }
    setTimeout(() => $('copy').textContent = 'Copy invite link (no code)', 2500);
  });
  $('leave').addEventListener('click', () => { if (es) es.close(); location.reload(); });
})();
</script>
</body>
</html>
