<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Wordle · Offsuit</title>
<style>
  @font-face{font-family:"Inter";font-style:normal;font-weight:100 900;font-display:swap;src:url("fonts/inter-latin.woff2") format("woff2")}
  :root{--bg:#000;--panel:#171717;--border:#262626;--text:#fff;--muted:#8A8A8A;--accent:#FFFF7D;--green:#4E9A5A;--yellow:#C9B458;--grey:#3A3A3C}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
  body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  header{width:100%;max-width:520px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border)}
  h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.02em}
  h1 span{color:var(--accent)}
  .seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .seg button{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;font-weight:600;padding:6px 10px;cursor:pointer}
  .seg button.on{background:var(--panel);color:var(--accent)}
  .icons{display:flex;gap:6px}
  .ib{background:none;border:1px solid var(--border);color:var(--text);border-radius:8px;font:inherit;font-size:13px;font-weight:600;padding:6px 9px;cursor:pointer}
  .ib:hover{border-color:#3a3a3a}
  .sub{color:var(--muted);font-size:12px;height:18px;margin-top:6px}
  #board{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;width:100%;padding:6px}
  .grid{display:grid;grid-template-rows:repeat(6,1fr);gap:5px;height:min(100%,calc((100vw - 24px) * 1.2));max-height:390px;aspect-ratio:5/6}
  .row{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
  .row.shake{animation:shake .45s}
  @keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
  .tile{display:flex;align-items:center;justify-content:center;border:2px solid var(--border);border-radius:6px;font-weight:700;font-size:clamp(18px,6.5vw,30px);text-transform:uppercase;background:#000;aspect-ratio:1}
  .tile.filled{border-color:#4a4a4a;animation:pop .1s}
  @keyframes pop{50%{transform:scale(1.08)}}
  .tile.correct,.tile.present,.tile.absent{border-color:transparent;animation:flip .5s ease both}
  .tile.correct{background:var(--green)}
  .tile.present{background:var(--yellow);color:#000}
  .tile.absent{background:var(--grey)}
  @keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
  .tile.win{animation:bounce .5s ease}
  @keyframes bounce{40%{transform:translateY(-14px)}}
  #kb{width:100%;max-width:520px;padding:6px 6px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:7px}
  .kr{display:flex;gap:5px;justify-content:center}
  .key{flex:1;min-width:0;height:54px;border:0;border-radius:6px;background:var(--panel);border:1px solid var(--border);color:var(--text);font:inherit;font-weight:700;font-size:15px;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  .key.wide{flex:1.5;font-size:12px}
  .key:active{filter:brightness(1.4)}
  .key.correct{background:var(--green);border-color:var(--green)}
  .key.present{background:var(--yellow);border-color:var(--yellow);color:#000}
  .key.absent{background:#111;color:#555;border-color:#1c1c1c}
  .spacer{flex:.5}
  #toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:var(--accent);color:#000;font-weight:700;font-size:14px;padding:10px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10;white-space:nowrap}
  #toast.on{opacity:1}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
  #modal.on{display:flex}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px;width:100%;max-width:360px;position:relative}
  .card h2{margin:0 0 12px;font-size:16px;letter-spacing:.06em;text-transform:uppercase}
  .close{position:absolute;top:10px;right:10px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin-bottom:16px}
  .stats b{display:block;font-size:26px}
  .stats span{font-size:11px;color:var(--muted)}
  .dist{display:flex;flex-direction:column;gap:4px;margin-bottom:16px}
  .bar{display:flex;align-items:center;gap:6px;font-size:13px}
  .bar i{font-style:normal;background:var(--grey);color:#fff;padding:2px 6px;border-radius:3px;min-width:22px;text-align:right;font-size:12px;font-weight:700}
  .bar i.hl{background:var(--accent);color:#000}
  .actions{display:flex;gap:8px}
  .btn{flex:1;background:var(--accent);color:#000;border:0;border-radius:8px;padding:12px;font:inherit;font-weight:700;cursor:pointer}
  .btn.alt{background:none;color:var(--text);border:1px solid var(--border)}
  .answer{color:var(--muted);font-size:13px;margin-bottom:12px}
  .answer b{color:var(--accent);letter-spacing:.1em}
  .muted{color:var(--muted);font-size:12px;margin-top:10px}
</style>
</head>
<body>
<header>
  <h1>Wordle<span>.</span></h1>
  <div class="seg"><button id="mDaily" class="on" type="button">Daily</button><button id="mPractice" type="button">Practice</button></div>
  <div class="icons"><button class="ib" id="newBtn" type="button" title="New practice game">New</button><button class="ib" id="statsBtn" type="button" title="Statistics">Stats</button></div>
</header>
<div class="sub" id="sub"></div>
<div id="board"><div class="grid" id="grid"></div></div>
<div id="kb"></div>
<div id="toast"></div>
<div id="modal"><div class="card">
  <button class="ib close" id="closeModal" type="button">✕</button>
  <h2 id="mTitle">Statistics</h2>
  <div class="answer" id="mAnswer"></div>
  <div class="stats" id="mStats"></div>
  <div class="dist" id="mDist"></div>
  <div class="actions"><button class="btn" id="shareBtn" type="button">Copy result</button><button class="btn alt" id="mNew" type="button">Practice game</button></div>
  <div class="actions" style="margin-top:8px"><button class="btn alt" id="roomShare" type="button" style="display:none">💬 Share to room</button></div>
  <div class="muted" id="mNext"></div>
</div></div>

(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const ans = []; for (let i = 0; i < ANSWERS.length; i += 5) ans.push(ANSWERS.slice(i, i + 5));
  const valid = new Set(); for (let i = 0; i < VALID.length; i += 5) valid.add(VALID.slice(i, i + 5));

  let mode = 'daily', answer, guesses = [], cur = '', over = false, won = false, today, busy = false;

  // ---- board & keyboard ----
  const grid = $('grid');
  for (let r = 0; r < ROWS; r++) { const row = document.createElement('div'); row.className = 'row'; for (let c = 0; c < COLS; c++) { const t = document.createElement('div'); t.className = 'tile'; row.appendChild(t); } grid.appendChild(row); }

  const KEYS = ['qwertyuiop', 'asdfghjkl', '+zxcvbnm-'];
  const keyEls = {};

    const kr = document.createElement('div'); kr.className = 'kr';

  });

  let toastT;
  function toast(msg, ms = 1400) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms); }

  function score(guess, target) {
    const res = Array(COLS).fill('absent'), left = {};
    for (let i = 0; i < COLS; i++) { if (guess[i] === target[i]) res[i] = 'correct'; else left[target[i]] = (left[target[i]] || 0) + 1; }
    for (let i = 0; i < COLS; i++) if (res[i] !== 'correct' && left[guess[i]]) { res[i] = 'present'; left[guess[i]]--; }
    return res;
  }
  const RANK = { absent: 1, present: 2, correct: 3 };

    const best = {};

  }
  function renderRow(r, word, states, animate) {
    const tiles = rowsEl[r].children;
    for (let c = 0; c < COLS; c++) {
      const t = tiles[c]; t.textContent = word[c] || ''; t.className = 'tile' + (word[c] ? ' filled' : '');
      if (states) { if (animate) { t.style.animationDelay = (c * 0.25) + 's'; } else t.style.animationDelay = '0s'; t.classList.add(states[c]); t.dataset.state = states[c]; }
      else { t.style.animationDelay = ''; delete t.dataset.state; }
    }
  }

  function submit() {
    if (cur.length < COLS) return shake('Not enough letters');
    if (!valid.has(cur)) return shake('Not in word list');
    const g = cur; guesses.push(g); cur = '';
    const states = score(g, answer);
    renderRow(guesses.length - 1, g, states, true);
    busy = true;
    won = g === answer; over = won || guesses.length >= ROWS;

    setTimeout(() => {

      else if (over) toast(answer.toUpperCase(), 2500);

  const ping = () => { if (embedded) try { parent.postMessage({ type: 'offsuit-stats', game: 'wordle' }, location.origin); } catch {} };
  function persist() {
    if (mode !== 'daily') return;

  }

    if (s.last === today) return; // already counted
    s.played++; s.last = today;
    if (won) {
      const y = sydDate(new Date(Date.UTC(+today.slice(0, 4), +today.slice(5, 7) - 1, +today.slice(8, 10)) - 864e5 + 12 * 36e5));
      s.streak = s.lastWin === y ? s.streak + 1 : 1; s.lastWin = today; s.wins++; s.dist[guesses.length - 1]++;

    save('stats', s);
  }
  function shareText() {

    const em = { correct: '🟩', present: '🟨', absent: '⬛' };

    $('mTitle').textContent = over ? (won ? 'You got it' : 'Next time') : 'Statistics';
    $('mAnswer').innerHTML = over ? 'The word was <b>' + answer.toUpperCase() + '</b>' : '';
    $('mStats').innerHTML = [[s.played, 'Played'], [s.played ? Math.round(s.wins / s.played * 100) : 0, 'Win %'], [s.streak, 'Streak'], [s.maxStreak, 'Max streak']].map(([v, l]) => '<div><b>' + v + '</b><span>' + l + '</span></div>').join('');
    const mx = Math.max(1, ...s.dist);
    $('mDist').innerHTML = s.dist.map((v, i) => '<div class="bar">' + (i + 1) + '<i class="' + (over && won && mode === 'daily' && guesses.length === i + 1 ? 'hl' : '') + '" style="width:' + Math.max(8, v / mx * 100) + '%">' + v + '</i></div>').join('');

  $('mDaily').addEventListener('click', e => { e.currentTarget.blur(); startDaily(); });
  $('mPractice').addEventListener('click', e => { e.currentTarget.blur(); startPractice(); });
  $('newBtn').addEventListener('click', e => { e.currentTarget.blur(); startPractice(); });
  $('statsBtn').addEventListener('click', e => { e.currentTarget.blur(); openModal(); });

  if (embedded) $('roomShare').style.display = '';

  // test/debug hook: practice with a fixed word via #practice=<word>
  const m = location.hash.match(/practice=([a-z]{5})/);
  if (m) startPractice(m[1]); else startDaily();
  window.addEventListener('hashchange', () => { const h = location.hash.match(/practice=([a-z]{5})/); if (h) startPractice(h[1]); });
  window.wordleState = () => ({ mode, guesses: guesses.slice(), over, won, answerLength: answer.length });
})();
</script>
